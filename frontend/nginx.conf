server {
    # 8080, not 80: an unprivileged (non-root) process can't bind ports below 1024
    listen 8080;
    server_name _;
    server_tokens off;   # don't advertise the Nginx version in headers/error pages

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API calls -> FastAPI container. "backend" is the Compose service name (Docker DNS).
    # No trailing slash on proxy_pass: the /api prefix is preserved, matching FastAPI's routes.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in asset filenames, so they can be cached for a long time.
    # Uses "expires" rather than add_header: any add_header inside a location block
    # silently drops ALL the security headers inherited from the server block.
    location /assets/ {
        expires 1y;
    }

    # Single-page app: unknown paths serve index.html and React handles them
    location / {
        try_files $uri $uri/ /index.html;
    }
}
