# Explicit rule set: CI behavior shouldn't change just because Ruff's defaults do.
target-version = "py314"

[lint]
# E4/E7/E9: core errors (E402 = imports must be at the top; our test guard is a deliberate exception)
# F: pyflakes (unused imports, undefined names)
# B: bugbear (likely bugs)
# RUF: Ruff's own rules (including "unused noqa")
select = ["E4", "E7", "E9", "F", "B", "RUF"]
